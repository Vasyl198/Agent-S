name: ML Dataset Report

'on':
  push:
    branches: [ "main", "ci/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем базовые зависимости
          pip install numpy pandas scikit-learn
          # Устанавливаем проект как пакет
          pip install -e .
          # Проверяем что пакет установлен
          pip show gui-agents
          # Проверяем PYTHONPATH и доступные модули
          python -c "import sys; print('Python path:'); [print(p) for p in sys.path]"
          python -c "import pkgutil; print('Available packages:'); [print(name) for _, name, _ in pkgutil.iter_modules()]"
          # Пробуем импортировать напрямую
          python -c "import agent; print('agent module found:', agent.__file__)"
          python -c "import agent.fashion; print('agent.fashion module found:', agent.fashion.__file__)"
          python -c "import agent.fashion.ml; print('agent.fashion.ml module found:', agent.fashion.ml.__file__)"
          python -c "import agent.fashion.ml.dataset_report; print('SUCCESS: Module imported successfully')"

      - name: Generate ML artifacts (bundle)
        run: |
          mkdir -p artifacts/ml
          python -m agent.fashion.ml.dataset_report \
            --dataset tests/fixtures/runs_mixed.jsonl \
            --check --min-runs 2 \
            --bundle --out-dir artifacts/ml \
            --stdout

      - name: Upload artifacts (private)
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: artifacts/ml/
          if-no-files-found: error
