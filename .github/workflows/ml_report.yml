name: ML Dataset Report

'on':
  push:
    branches: [ "main", "ci/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем базовые зависимости
          pip install numpy pandas scikit-learn
          # Добавляем текущую директорию в PYTHONPATH
          echo "PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE" >> $GITHUB_ENV
          # Устанавливаем проект как пакет
          pip install -e .
          # Проверяем что пакет установлен
          pip show gui-agents
          # Проверяем PYTHONPATH
          echo "PYTHONPATH: $PYTHONPATH"
          # Пробуем импортировать напрямую с PYTHONPATH
          python -c "import sys; sys.path.insert(0, '.'); import agent.fashion.ml.dataset_report; print('SUCCESS: Module imported successfully')"

      - name: Generate ML artifacts (bundle)
        run: |
          mkdir -p artifacts/ml
          python -m agent.fashion.ml.dataset_report \
            --dataset tests/fixtures/runs_mixed.jsonl \
            --check --min-runs 2 \
            --bundle --out-dir artifacts/ml \
            --stdout

      - name: Upload artifacts (private)
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: artifacts/ml/
          if-no-files-found: error
